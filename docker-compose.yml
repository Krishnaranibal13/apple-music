services:
  db:
    image: postgres:16-alpine
    container_name: apple-music-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apple-music-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apple-music-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/apple-music/music_library:/app/music_library
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - apple-music-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: apple-music-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - apple-music-network

  nginx:
    image: nginx:alpine
    container_name: apple-music-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - apple-music-network

volumes:
  postgres_data:

networks:
  apple-music-network:
    driver: bridge
